name: TikTok Sandık Botu

on:
  schedule:
    - cron: '*/5 * * * *' # Her 5 dakikada bir otomatik çalışır
  workflow_dispatch: # Elle başlatma butonu ekler

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: pip install requests

      - name: Botu Çalıştır
        run: python bot.py
        
